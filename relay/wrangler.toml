name = "slimebeep-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "GROUP"
class_name = "Group"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Group"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Mailbox"]

# The linked group: the Void Order chat, brought in by the Void Order add-on server (it holds LINK_KEY).
[vars]
LINK_GID = "765jbnek0x2qq5cl"
LINK_NAME = "Void Order"
